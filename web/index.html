<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-title" content="AU Mix">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="152x152" href="/static/touch-icon-ipad.png">
  <script src="static/script.js?version=10" defer></script>
  <title>AU Mix</title>
  <link rel="stylesheet" href="static/styles.css?version=4"></style>
</head>
<body>
  <div class="content">
    <header>
      <div class="title">AU Mix</div>
      <div class="tab" id="mixer">Mixer</div>
      <div class="tab" id="scenes">Scenes</div>
      <div class="tab" id="performance">Performance</div>
      <div class="status" id="network-icon">
        <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 7L1.17157 5.82843C2.98259 4.01741 5.43884 3 8 3C10.5612 3 13.0174 4.01742 14.8284 5.82843L16 7L14.5858 8.41421L13.4142 7.24264C11.9783 5.8067 10.0307 5 8 5C5.96928 5 4.02173 5.8067 2.58579 7.24264L1.41421 8.41421L0 7Z"/>
          <path d="M4.24264 11.2426L2.82843 9.82843L4 8.65685C5.06086 7.59599 6.49971 7 8 7C9.50029 7 10.9391 7.59599 12 8.65686L13.1716 9.82843L11.7574 11.2426L10.5858 10.0711C9.89999 9.38527 8.96986 9 8 9C7.03014 9 6.1 9.38527 5.41421 10.0711L4.24264 11.2426Z"/>
          <path d="M8 15L5.65685 12.6569L6.82842 11.4853C7.13914 11.1746 7.56057 11 8 11C8.43942 11 8.86085 11.1746 9.17157 11.4853L10.3431 12.6569L8 15Z"/>
        </svg>
      </div>
    </header>

    <div class="page" id="mixer">
      <h1>Hello World!</h1>

      <input type="text" id="socket-input">
      <button id="send">Send</button>

      <p id="socket-response"></p>

      <input 
          class="vertical-slider"
          id="fader-1" 
          type="range" 
          name="fader-1" 
          min="0" 
          max="1024" 
          orient="vertical" 
          oninput="fader1Changed()" 
      />
    </div>

    <div class="page" id="scenes">
      <div class="scene-container">
        <div class="scene-actions">
        </div>
        <div class="scene-list"></div>
      </div>
    </div>

    <div class="page" id="performance">
      <div>
        <button id="get-info">Get X32 Info</button>
        <button id="get-status">Get X32 Status</button>
      </div>
    </div>
  </div>
  
  <div class="popup" id="connectionModal">
    <div class="popup-container">
      <div class="popup-header">
        Network Information
      </div>
      <div class="popup-content">
        <div class="info-row">
          <span>Web Socket:</span>
          <span class="status" id="socket-status"></span>
        </div>
        <div class="info-row">
          <span>X32 Mixer:</span>
          <span class="status" id="mixer-status"></span>
        </div>
        <div class="info-row">
          <label for="mixer-ip">Mixer IP: </label>
          <input type="text" name="mixer-ip" id="mixer-ip" />
        </div>
        <div class="info-row">
          <label for="mixer-port">Mixer port: </label>
          <input type="number" name="mixer-port" id="mixer-port" />
        </div>
        <div class="justify-center margin-1">
          <button id="mixer-connect">Connect</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
