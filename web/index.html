<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-title" content="AU Mix">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="152x152" href="/static/touch-icon-ipad.png">
  <script src="static/script.js?version=10" defer></script>
  <title>AU Mix</title>
  <link rel="stylesheet" href="static/styles.css?version=6"></style>
</head>
<body>
  <div class="content">
    <header>
      <div class="title">AU Mix</div>
      <div class="tab" id="mixer">Mixer</div>
      <div class="tab" id="scenes">Scenes</div>
      <div class="tab" id="performance">Performance</div>
      <div class="tab" id="samples">Samples</div>
      <div class="status" id="network-icon">
        <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 7L1.17157 5.82843C2.98259 4.01741 5.43884 3 8 3C10.5612 3 13.0174 4.01742 14.8284 5.82843L16 7L14.5858 8.41421L13.4142 7.24264C11.9783 5.8067 10.0307 5 8 5C5.96928 5 4.02173 5.8067 2.58579 7.24264L1.41421 8.41421L0 7Z"/>
          <path d="M4.24264 11.2426L2.82843 9.82843L4 8.65685C5.06086 7.59599 6.49971 7 8 7C9.50029 7 10.9391 7.59599 12 8.65686L13.1716 9.82843L11.7574 11.2426L10.5858 10.0711C9.89999 9.38527 8.96986 9 8 9C7.03014 9 6.1 9.38527 5.41421 10.0711L4.24264 11.2426Z"/>
          <path d="M8 15L5.65685 12.6569L6.82842 11.4853C7.13914 11.1746 7.56057 11 8 11C8.43942 11 8.86085 11.1746 9.17157 11.4853L10.3431 12.6569L8 15Z"/>
        </svg>
      </div>
    </header>

    <div class="page" id="mixer">
      <p id="socket-response"></p>

      <div class="mix-section">
        <div class="mix-fader">
          <input 
            class="fader"
            id="fader-1" 
            type="range" 
            name="fader-1" 
            min="0" 
            max="1024" 
          />
          <span class="level" id="level-1"></span>
        </div>
        <div class="mix-fader">
          <input 
            class="fader"
            id="fader-2" 
            type="range" 
            name="fader-2" 
            min="0" 
            max="1024" 
          />
          <span class="level" id="level-2"></span>
        </div>
        <div class="mix-fader">
          <input 
            class="fader"
            id="fader-3" 
            type="range" 
            name="fader-3" 
            min="0" 
            max="1024" 
          />
          <span class="level" id="level-3"></span>
        </div>
        <div class="mix-fader">
          <input 
            class="fader"
            id="fader-4" 
            type="range" 
            name="fader-4" 
            min="0" 
            max="1024" 
          />
          <span class="level" id="level-4"></span>
        </div>
        <div class="mix-fader">
          <input 
            class="fader"
            id="fader-5" 
            type="range" 
            name="fader-5" 
            min="0" 
            max="1024" 
          />
          <span class="level" id="level-5"></span>
        </div>
        <div class="mix-fader">
          <input 
            class="fader"
            id="fader-6" 
            type="range" 
            name="fader-6" 
            min="0" 
            max="1024" 
          />
          <span class="level" id="level-6"></span>
        </div>
        <div class="mix-fader">
          <input 
            class="fader"
            id="fader-7" 
            type="range" 
            name="fader-7" 
            min="0" 
            max="1024" 
          />
          <span class="level" id="level-7"></span>
        </div>
        <div class="mix-fader">
          <input 
            class="fader"
            id="fader-8" 
            type="range" 
            name="fader-8" 
            min="0" 
            max="1024" 
          />
          <span class="level" id="level-8"></span>
        </div>
      </div>
    </div>

    <div class="page" id="scenes">
      <div class="scene-container">
        <div class="scene-actions">
        </div>
        <div class="scene-list"></div>
      </div>
    </div>

    <div class="page" id="performance">
    </div>

    <div class="page" id="samples">
      <div class="samples-container">
        <div class="sample-line">
          <label for="sample-dropdown">Choose a sample</label>
          <select name="sample-dropdown" id="sample-dropdown"></select>
          <button id="sample-refresh">Refresh Samples</button>
        </div>

        <div class="sample-line">
          <button id="sample-play">Play Sample</button>
          <button id="sample-stop">Stop Sample</button>
          <button id="sample-delete">Delete Sample</button>
        </div>

        <div class="sample-line">
          <label for="sample-file"></label>
          <input name="sample-file" id="sample-file" type="file" accept=".mp3,.wav">
          <button id="sample-upload">Upload Sample</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="popup" id="connectionModal">
    <div class="popup-container">
      <div class="popup-header">
        Network Information
      </div>
      <div class="popup-content">
        <div class="info-row">
          <span>Web Socket:</span>
          <span class="status" id="socket-status"></span>
        </div>
        <div class="info-row">
          <span>X32 Mixer:</span>
          <span class="status" id="mixer-status"></span>
        </div>
        <div class="info-row">
          <label for="mixer-ip">Mixer IP: </label>
          <input type="text" name="mixer-ip" id="mixer-ip" />
        </div>
        <div class="info-row">
          <label for="mixer-port">Mixer port: </label>
          <input type="number" name="mixer-port" id="mixer-port" />
        </div>
        <div class="justify-center margin-1">
          <button id="mixer-connect">Connect</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
